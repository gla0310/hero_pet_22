name: hero_pet
description: "hero pet - internal front-desk management system for a veterinary clinic (Offline)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9


  # Local database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # Date and time
  intl: ^0.20.2

  # Capture photos from camera / gallery
  image_picker: ^1.1.2

  # Open WhatsApp
  url_launcher: ^6.3.0

  # Pick files for backup / restore
  file_picker: ^10.3.0

  # Generate unique id
  uuid: ^4.4.0

  # Share files (backup)
  share_plus: ^12.0.0

  # Generate PDF files for electronic forms
  pdf: ^3.10.7
  # Preview and print/share PDF files
  printing: ^5.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # When adding a clinic icon or logo, put it here:
  # assets:
  #   - assets/images/logo.png

  assets:
    - assets/fonts/

  # Embedded font (works offline from first use) - used when generating
  # PDF files for electronic forms
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
