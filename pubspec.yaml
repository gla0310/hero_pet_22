name: hero_pet
description: "hero pet - نظام إدارة داخلي لعيادة بيطرية (Offline)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9


  # قاعدة البيانات المحلية
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # التاريخ والوقت
  intl: ^0.20.2

  # التقاط الصور من الكاميرا / المعرض
  image_picker: ^1.1.2

  # فتح واتساب
  url_launcher: ^6.3.0

  # اختيار ملفات للنسخ الاحتياطي / الاستعادة
  file_picker: ^10.3.0

  # أيقونة توليد id فريد
  uuid: ^4.4.0

  # مشاركة الملفات (نسخة احتياطية)
  share_plus: ^12.0.0

  # إنشاء ملفات PDF للاستمارات الإلكترونية
  pdf: ^3.10.7
  # معاينة وطباعة/مشاركة ملفات الـ PDF
  printing: ^5.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # عند إضافة أيقونة أو شعار العيادة ضعه هنا:
  # assets:
  #   - assets/images/logo.png

  assets:
    - assets/fonts/

  # خط عربي مضمّن داخل التطبيق (يعمل بدون إنترنت من أول استخدام) - يُستخدم
  # في إنشاء ملفات PDF للاستمارات الإلكترونية حتى تظهر الحروف العربية بشكل صحيح
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
