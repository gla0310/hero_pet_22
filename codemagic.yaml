workflows:
  ios-unsigned:
    name: iOS Unsigned Build (for Sideloadly)
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
          cd ..

      - name: Build iOS app WITHOUT code signing
        script: |
          flutter build ios --release --no-codesign

      - name: Package the .app into a sideload-ready .ipa
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r unsigned.ipa Payload
          cd ../../..

    artifacts:
      - build/ios/iphoneos/unsigned.ipa
